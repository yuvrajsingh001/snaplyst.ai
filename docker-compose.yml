services:
  # Frontend (Next.js)
  frontend:
    build: ./frontend
    container_name: snaplyst_frontend
    command: sh -c "CI=true pnpm install && pnpm run dev"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      CI: "true"
    networks:
      - snaplyst_net

networks:
  snaplyst_net: